[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fnc-rubika"
version = "0.2.6"
description = "Private, resilient, session-based Rubika client foundation"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = { text = "Proprietary" }
authors = [{ name = "FNC" }]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "pycryptodome>=3.20,<4",
  "keyring>=24,<26",
  "chroma-term-console>=0.1.4,<0.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
fnc-rubika = "fnc_rubika.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fnc_rubika"]

[tool.hatch.build.targets.wheel.force-include]
"src/fnc_rubika/contracts/rubika-session.catalog.json" = "fnc_rubika/contracts/rubika-session.catalog.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
